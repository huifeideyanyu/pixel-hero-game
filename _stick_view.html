<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#5d6b7d;font-family:monospace;display:flex;gap:30px;padding:20px;align-items:flex-start}
canvas{image-rendering:pixelated}div{color:#fff;font-size:12px}
</style></head><body>
<canvas id="c1" width="90" height="240"></canvas>
<canvas id="c2" width="200" height="520"></canvas>
<div>left: in-game 24x124</div>
<script>
const img=new Image();
img.onload=()=>{
  const a=document.getElementById('c1').getContext('2d');a.imageSmoothingEnabled=false;
  a.fillStyle='#4a5a6e';a.fillRect(0,0,90,240);
  a.save();a.translate(45,200);a.rotate(-0.12);a.drawImage(img,-12,-124,24,124);
  a.restore();
  const b=document.getElementById('c2').getContext('2d');b.imageSmoothingEnabled=false;
  b.drawImage(img,4,10,192,496);
};
img.src='assets/weapon-stick.png';
</script></body></html>
